name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: xcrun swift-format lint --recursive InkEdit InkEditTests InkEditUITests
      - name: Build and test
        run: |
          xcodebuild test \
            -project InkEdit.xcodeproj \
            -scheme InkEdit \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
